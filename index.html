    --card: #fffcf8;

    --muted: #6a6258;
    --line: #e3dcd0;
    --teal: #0f5e56;
    --teal-soft: #e4f2ef;
    --clay: #b5522a;
    --clay-soft: #f8ebe4;
    --gold: #8d6a2f;
    --gold-soft: #f6edd9;
    --good: #1d6b45;
    --good-soft: #e5f3eb;
    --side: #142421;
    --side-text: #d7e4de;
    --gold-line: #e7b15a;
    --shadow: 0 1px 0 rgba(28, 25, 22, .04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Outfit, "Avenir Next", "Segoe UI", sans-serif;

    background: var(--paper);
    font-size: 15px;
    line-height: 1.45;

  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, .num { font-family: Fraunces, Georgia, serif; font-weight: 560; letter-spacing: -0.03em; margin: 0; }
  p { margin: 0; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .gate { display: grid; grid-template-columns: minmax(300px, 1.05fr) minmax(320px, .95fr); min-height: 100vh; }
  .gate-brand { background: var(--side); color: #f6f3ec; padding: 48px 44px; display: flex; flex-direction: column; gap: 18px; }
  .gate-brand h1 { font-size: clamp(48px, 6vw, 76px); line-height: .95; color: #f6f3ec; }
  .gate-brand .lede { color: #c9d7d1; max-width: 46ch; font-size: 17px; }
  .brand-lockup { display: flex; align-items: center; gap: 10px; color: var(--gold-line); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
  .module-list { margin-top: 8px; display: grid; gap: 10px; }
  .module-list li { list-style: none; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; color: #d5e2dc; }
  .module-list ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .idx { width: 28px; height: 28px; border: 1px solid rgba(231, 177, 90, .45); border-radius: 50%; display: grid; place-items: center; color: var(--gold-line); font-size: 13px; }
  .gate-panel { padding: 36px 32px 48px; display: flex; flex-direction: column; gap: 14px; }
  .gate-panel h2 { font-size: 28px; }
  .role-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
  .role-card ul { margin: 4px 0 8px; padding-left: 18px; }
  .role-card li { margin: 4px 0; }
  .who { color: var(--muted); }

  .shell { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
  aside { background: var(--side); color: var(--side-text); padding: 22px 14px 16px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
  .side-brand { display: flex; gap: 10px; align-items: center; padding: 0 8px; color: #f6f3ec; }
  .side-brand strong { display: block; font-family: Fraunces, Georgia, serif; font-size: 20px; font-weight: 560; letter-spacing: -0.03em; }
  .side-brand span { color: #9fb2ab; font-size: 12px; }
  nav { display: flex; flex-direction: column; gap: 4px; }
  .nav { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; background: transparent; border: 0; color: var(--side-text); padding: 10px 12px; border-radius: 12px; }
  .nav span { line-height: 1.25; }
  .nav svg { flex: none; opacity: .9; }
  .nav.active { background: #f4f1ea; color: var(--ink); }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 0 8px; }
  .linkish { background: none; border: 0; color: #b7c7c0; padding: 6px 0; text-align: left; }
  .linkish:hover { color: white; }

  .workspace { min-width: 0; }
  .top { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 14px 28px; background: rgba(239, 234, 225, .92); backdrop-filter: blur(12px); border-bottom: 1px solid transparent; }
  .top-title { display: flex; flex-direction: column; gap: 2px; }
  .top-title strong { font-size: 14px; }
  .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .top-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

  .switch button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

  main { padding: 8px 28px 56px; max-width: 1180px; }
  .page-head { display: flex; justify-content: space-between; gap: 18px; align-items: flex-end; margin: 10px 0 16px; }
  .page-head h1 { font-size: clamp(32px, 4vw, 44px); line-height: 1; }
  .lede { color: var(--muted); max-width: 68ch; margin-top: 8px; }
  .kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--clay); font-weight: 600; }
  .access { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .access b { color: var(--ink); font-weight: 600; }
  .page-actions, .row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .btn { border-radius: 999px; padding: 10px 16px; border: 1px solid transparent; background: var(--card); font-weight: 600; }

  .btn.quiet { background: transparent; border-color: var(--line); }
  .btn.quiet:hover { border-color: #c9bfb0; }
  .btn.ink { background: var(--ink); color: #f6f3ec; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .stats { display: grid; grid-template-columns: 1.45fr repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); text-align: left; }
  button.stat { width: 100%; cursor: pointer; }
  button.stat:hover { border-color: #c9bfb0; }
  .stat span { color: var(--muted); font-size: 13px; }
  .stat em { font-style: normal; color: var(--muted); font-size: 13px; }
  .stat .num { font-size: 30px; line-height: 1.05; }
  .stat.hero { background: var(--side); color: #f6f3ec; border-color: var(--side); }
  .stat.hero span, .stat.hero em { color: #c5d5ce; }
  .track { height: 8px; background: #2c463f; border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .track span { display: block; height: 100%; background: var(--gold-line); }
  .track.light { background: #ece6db; }
  .track.light span { background: var(--teal); }

  .grid-2 { display: grid; grid-template-columns: 1.15fr .85fr; gap: 12px; }
  .grid-main { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 12px; align-items: start; }
  .grid-main > * { min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 8px; box-shadow: var(--shadow); }
  .card.pad { padding: 16px; }
  .card h2 { font-size: 26px; }
  .card-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 6px; }
  .item { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
  .item:last-child { border-bottom: 0; }
  .muted { color: var(--muted); }
  .split-meta { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }

  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .chip { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 12px 14px; box-shadow: var(--shadow); }
  .chip:hover { border-color: var(--teal); }
  .chip strong { font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 560; line-height: 1.1; }
  .chip .muted { font-size: 13px; }
  .chip.paid { box-shadow: inset 3px 0 0 var(--good); }
  .chip.unpaid { box-shadow: inset 3px 0 0 var(--clay); }
  .chip.vacant { box-shadow: inset 3px 0 0 #c8c0b4; }

  .toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: end; margin: 6px 0 12px; flex-wrap: wrap; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }

  .seg button.on { background: var(--ink); color: #f6f3ec; border-color: var(--ink); }
  .field { display: grid; gap: 6px; min-width: 0; }
  .toolbar .field { min-width: 200px; }
  .field span, .hint { color: var(--muted); font-size: 13px; }
  .field.inline { grid-auto-flow: column; align-items: center; min-width: 0; }
  input, select, textarea { background: white; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
  textarea { min-height: 110px; resize: vertical; }
  .form-grid { display: grid; gap: 12px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--card); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  table.ledger { min-width: 1040px; }
  .seg-label { color: var(--muted); font-size: 12px; align-self: center; }
  th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  td, th { padding: 12px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tfoot td { font-weight: 600; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.neutral { background: #eeeae2; color: #5c564c; }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.warn { background: var(--gold-soft); color: #7a5410; }
  .pill.bad { background: var(--clay-soft); color: var(--clay); }
  .pill.info { background: var(--teal-soft); color: var(--teal); }

  .stack { display: grid; gap: 10px; }
  .record { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 8px; }
  .record header { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
  .reply { background: #f7f4ee; border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; }
  .banner { background: var(--good-soft); color: var(--good); border-radius: 12px; padding: 10px 12px; font-weight: 600; }
  dl.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 16px; margin: 0; }
  dt { color: var(--muted); font-size: 12px; }
  dd { margin: 0; font-weight: 600; }

  .calc { background: var(--teal-soft); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .calc .lbl { color: var(--teal); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
  .calc strong { display: block; font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 560; }

  .overlay { position: fixed; inset: 0; background: rgba(18, 28, 26, .48); display: grid; place-items: center; padding: 24px; z-index: 20; overflow: auto; }
  .modal { width: min(560px, 100%); background: var(--card); border-radius: 18px; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.18); }
  .modal.wide { width: min(680px, 100%); }
  .modal h2 { font-size: 30px; margin-bottom: 4px; }
  .doc { border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin: 12px 0; background: white; }

  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(12px); background: var(--side); color: #f6f3ec; padding: 12px 16px; border-radius: 16px; max-width: min(640px, calc(100% - 32px)); opacity: 0; pointer-events: none; transition: .2s ease; z-index: 40; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 980px) {
    .gate, .shell, .stats, .grid-2, .grid-main, .chips, .form-row { grid-template-columns: 1fr; }
    aside { position: sticky; top: 0; height: auto; z-index: 6; }
    nav { flex-direction: row; overflow: auto; }
    .nav { width: auto; white-space: nowrap; }
    .side-foot { flex-direction: row; }
    .shell { grid-template-columns: 1fr; }
    main, .top { padding-left: 16px; padding-right: 16px; }
    .page-head { flex-direction: column; align-items: start; }
  }
</style>

function rentStats() {

  const collected = paid.reduce((sum, u) => sum + u.rent, 0);
  const due = rows.reduce((sum, u) => sum + u.rent, 0);

}
function meterMath(prev, curr, price) {
  const p = Number(prev), c = Number(curr), r = Number(price);
  if ([p, c, r].some(n => Number.isNaN(n))) return null;

}

    const rec = meterFor(unit.id);
    if (!rec) return { unit, rec: null, units: null, bill: null };

    return { unit, rec, units, bill: Math.round(units * rec.price * 100) / 100 };

        </tr>`).join("")}</tbody>
      </table></div>
    </div>`;
}
function previewHtml(prev, curr, price) {
  const math = meterMath(prev, curr, price);
  const formula = `<p class="hint">Units consumed = current − previous. Water bill = units consumed × unit price.</p>`;
  if (curr === "" || curr == null || !math) return formula;
  if (math.units < 0 || math.price <= 0) return `<p class="hint">Current reading needs to be at least the previous reading, and the unit price needs to be above zero.</p>`;
  return `<div class="calc"><div><span class="lbl">Units consumed</span><strong>${qty(math.units)}</strong></div><div><span class="lbl">Water bill</span><strong>${kes(math.bill)}</strong></div></div>${formula}`;
}

        <button type="button" class="btn quiet" data-action="close-modal">Cancel</button>
        <button type="submit" class="btn quiet" name="intent" value="save">Save response</button>
        <button type="submit" class="btn primary" name="intent" value="resolve">Resolve and notify tenant</button>
      </div>
    </form>`);
}
function invoiceModal() {
  const unit = unitById(ui.modal.id);
  const pay = unit && payFor(unit.id);
  if (!unit || !pay?.invoiceNo) return "";
  const bill = waterBill(unit.id);
  const total = unit.rent + (bill || 0);
  return modalShell("Service charge invoice", "Rent and water, delivered by email and WhatsApp.", `
    <div class="doc">
      <div class="doc-top"><div><span class="kicker">Invoice</span><h3>${esc(pay.invoiceNo)}</h3></div><strong>${kes(total)}</strong></div>
      <dl class="meta">
        <div><dt>Unit</dt><dd>${unit.id}</dd></div>
        <div><dt>Tenant</dt><dd>${esc(unit.tenant)}</dd></div>
        <div><dt>Period</dt><dd>${periodLabel(pay.period)}</dd></div>
        <div><dt>Rent</dt><dd>${kes(unit.rent)} · ${pay.status === "paid" ? "Paid" : "Unpaid"}</dd></div>
        <div><dt>Water bill</dt><dd>${bill == null ? "Not billed" : kes(bill) + " · " + (pay.waterStatus === "paid" ? "Paid" : "Unpaid")}</dd></div>
        <div><dt>Rent paid on</dt><dd>${pay.paidAt ? fmtStamp(pay.paidAt) : "—"}</dd></div>
        <div><dt>Water paid on</dt><dd>${pay.waterPaidAt ? fmtStamp(pay.waterPaidAt) : "—"}</dd></div>
        <div><dt>Email</dt><dd>${esc(unit.email)}</dd></div>
        <div><dt>WhatsApp</dt><dd>${esc(unit.phone)}</dd></div>
        <div><dt>Sent</dt><dd>${fmtStamp(pay.invoiceSentAt)}</dd></div>
      </dl>
    </div>
    <div class="modal-actions"><button type="button" class="btn primary" data-action="close-modal">Close</button></div>`, true);
}
function visitorModal() {
  const unit = unitById(ui.unitId);
  return modalShell("Register a visitor", `Security will see the name, unit ${unit.id}, and the expected date.`, `
    <form class="form-grid" data-form="visitor" style="margin-top:12px">
      <label class="field"><span>Visitor name</span><input name="name" required placeholder="Full name"></label>
      <div class="form-row">
        <label class="field"><span>Expected date</span><input name="expectedDate" type="date" required value="${TODAY}"></label>
        <label class="field"><span>Expected time</span><input name="expectedTime" type="time"></label>
      </div>
      <label class="field"><span>Note</span><input name="note" placeholder="Optional, for example family or contractor"></label>
      <div class="modal-actions"><button type="button" class="btn quiet" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">Send to security</button></div>
    </form>`);
}
function checkinModal() {
  const item = data.visitors.find(v => v.id === ui.modal.id);
  if (!item) return "";
  return modalShell("Check in visitor", `${esc(item.name)} · unit ${item.unitId} · expected ${expectedLabel(item)}. Record the phone and ID at the gate.`, `
    <form class="form-grid" data-form="checkin" style="margin-top:12px">
      <input type="hidden" name="id" value="${item.id}">
      <label class="field"><span>Phone number</span><input name="phone" required placeholder="+254 7…"></label>
      <label class="field"><span>ID number</span><input name="idNumber" required placeholder="National ID or passport"></label>
      <div class="modal-actions"><button type="button" class="btn quiet" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">Confirm check in</button></div>
    </form>`);
}

function closeModal() { ui.modal = null; render(); }
function go(view) { ui.view = view; ui.modal = null; saveUi(); render({ toTop: true }); }

function saveProvider(fd) {
  const amount = Number(fd.get("amount"));
  if (!fd.get("provider").trim() || !(amount > 0)) return toast("Enter the provider and an amount above zero.");
  const fields = { category: fd.get("category"), provider: fd.get("provider").trim(), email: fd.get("email").trim(), detail: fd.get("detail").trim(), amount };
  const existing = data.providers.find(p => p.id === fd.get("id"));
  if (existing) {
    if (existing.status !== "draft") return toast("Only a draft request can be edited.");
    Object.assign(existing, fields);
    save(); closeModal();
    toast("Draft updated.");
    return;
  }
  data.providers.unshift({
    id: uid("p"), period: periodKey(), ...fields, status: "draft", requestedAt: null, paidAt: null, method: null, reference: null, receiptNo: null
  });
  save(); closeModal();
  toast(`Draft saved for ${periodLabel()}. Review it on the finance request page.`);
}
function triggerProviders() {
  const drafts = periodProviders().filter(p => p.status === "draft");
  if (!drafts.length) return toast(`No drafts for ${periodLabel()}. Add an expense first.`);
  const now = new Date().toISOString();
  drafts.forEach(p => { p.status = "requested"; p.requestedAt = now; });
  notify("management", "Payment request", `${drafts.length} ${periodLabel()} expense${drafts.length === 1 ? "" : "s"} sent from the landlord.`, "Service Provider Management");
  notify("landlord", "Request sent", `${drafts.length} ${periodLabel()} expense${drafts.length === 1 ? "" : "s"} sent to Finance.`, "Service Provider Management");
  save(); render();
  toast(`${periodLabel()} request sent to Finance · ${drafts.length} expense${drafts.length === 1 ? "" : "s"}.`);
}
function payProvider(fd) {
  const item = data.providers.find(p => p.id === fd.get("id"));
  if (!item || item.status !== "requested") return toast("That request is no longer waiting for payment.");
  data.counters.receipt += 1;
  item.status = "paid";
  item.paidAt = new Date().toISOString();
  item.method = fd.get("method");
  item.reference = fd.get("reference").trim();
  item.receiptNo = "RCP-" + periodCode(item.period) + "-" + String(data.counters.receipt).padStart(3, "0");
  notify("landlord", "Receipt copy", `${item.receiptNo} for ${item.provider} was sent to ${item.email} and copied to you.`, "Service Provider Management");
  save(); closeModal();
  toast(`${item.receiptNo} issued. Sent to ${item.provider} and copied to the landlord.`);
}
function saveComplaint(fd) {
  const subject = fd.get("subject").trim();
  const details = fd.get("details").trim();
  if (!subject || !details) return toast("Add a subject and the complaint details.");
  const unit = unitById(ui.unitId);
  data.complaints.unshift({
    id: uid("c"), period: periodKey(), unitId: unit.id, category: fd.get("category"), subject, details,
    createdAt: new Date().toISOString(), status: "open", response: "", respondedAt: null, resolvedAt: null
  });
  notify("management", "New complaint", `${unit.id} · ${subject}`, "Complaint Management");
  notify("landlord", "New complaint", `${unit.id} · ${unit.tenant} · ${subject}`, "Complaint Management");
  save(); closeModal();
  toast("Complaint sent. Management and the landlord can see it.");
}
function saveResponse(fd, intent) {
  const item = data.complaints.find(c => c.id === fd.get("id"));
  const text = fd.get("response").trim();
  if (!item || !text) return toast("Write the response details first.");
  const unit = unitById(item.unitId);
  item.response = text;
  item.respondedAt = new Date().toISOString();
  if (intent === "resolve") {
    item.status = "resolved";
    item.resolvedAt = item.respondedAt;
    notify("tenant", "Complaint resolved", `${item.subject} is Resolved. ${text}`, "Complaint Management", item.unitId);
    notify("landlord", "Complaint resolved", `${item.unitId} · ${item.subject} is Resolved.`, "Complaint Management");
    save(); closeModal();
    toast(`Marked Resolved. Confirmation sent to ${unit.tenant} (${item.unitId}).`);
    return;
  }
  item.status = "responded";
  notify("tenant", "Management replied", `${item.subject}: ${text}`, "Complaint Management", item.unitId);
  notify("landlord", "Response posted", `${item.unitId} · ${item.subject} is Responded.`, "Complaint Management");
  save(); closeModal();
  toast("Response saved. Status is Responded. Resolve it when the work is finished.");
}
function syncCharges() {
  const applied = [];
  const waterApplied = [];
  data.pendingPayments = data.pendingPayments.filter(entry => {
    if (entry.period !== periodKey()) return true;
    const pay = payFor(entry.unitId);
    if (!pay || pay.status === "paid") return false;
    pay.status = "paid";
    pay.paidAt = entry.paidAt;
    pay.method = entry.method;
    pay.reference = entry.reference;
    applied.push(entry.unitId);
    return false;
  });
  data.pendingWater = (data.pendingWater || []).filter(entry => {
    if (entry.period !== periodKey()) return true;
    const pay = payFor(entry.unitId);
    const bill = waterBill(entry.unitId);
    if (!pay || bill == null || pay.waterStatus === "paid") return false;
    pay.waterStatus = "paid";
    pay.waterPaidAt = entry.paidAt;
    pay.waterMethod = entry.method;
    waterApplied.push(entry.unitId);
    return false;
  });
  const sent = [];
  occupied().forEach(unit => {
    const pay = payFor(unit.id);
    if (!pay || pay.invoiceSentAt) return;
    pay.invoiceNo = "INV-" + unit.id.replace("-", "") + "-" + periodCode();
    pay.invoiceSentAt = new Date().toISOString();
    sent.push(unit.id);
    const bill = waterBill(unit.id);
    notify("tenant", "Invoice sent", `${pay.invoiceNo} for rent ${kes(unit.rent)}${bill == null ? "" : " and water " + kes(bill)} was sent by email and WhatsApp.`, "Service Charge Management", unit.id);
  });
  if (!data.chargeSyncAt || typeof data.chargeSyncAt !== "object") data.chargeSyncAt = {};
  data.chargeSyncAt[periodKey()] = new Date().toISOString();
  const summary = `Synced ${periodLabel()}` + (applied.length ? `. New rent payment: ${applied.join(", ")}` : ". No new rent payments") + (waterApplied.length ? `. Water paid: ${waterApplied.join(", ")}` : "") + (sent.length ? `. Invoices sent to ${sent.join(", ")}.` : ". Invoices were already sent.");
  notify("landlord", periodLabel() + " service charge cycle", summary, "Service Charge Management");
  save(); render();
  toast(summary + " Delivery is email and WhatsApp.");
}
function sendInvoice(unitId) {
  const unit = unitById(unitId);
  const pay = payFor(unitId);
  if (!unit?.tenant || !pay) return toast("That unit has no tenant to invoice.");
  const freshInvoice = !pay.invoiceNo;
  pay.invoiceNo = pay.invoiceNo || ("INV-" + unit.id.replace("-", "") + "-" + periodCode());
  pay.invoiceSentAt = new Date().toISOString();
  const bill = waterBill(unit.id);
  notify("tenant", freshInvoice ? "Invoice sent" : "Invoice resent", `${pay.invoiceNo} for rent ${kes(unit.rent)}${bill == null ? "" : " and water " + kes(bill)} was sent by email and WhatsApp.`, "Service Charge Management", unit.id);
  save(); render();
  toast(`${pay.invoiceNo} sent to ${unit.tenant} by email (${unit.email}) and WhatsApp (${unit.phone}).`);
}
function saveMeter(fd) {
  const unit = unitById(fd.get("unitId"));
  const math = meterMath(fd.get("previous"), fd.get("current"), fd.get("price"));
  if (!unit || !math || math.units < 0 || math.price <= 0) return toast("Check the readings. Current needs to be at least previous, and the unit price needs to be above zero.");
  let rec = meterFor(unit.id);
  const verb = rec ? "updated" : "saved";
  if (!rec) {
    rec = { id: uid("m"), unitId: unit.id, period: periodKey() };
    data.meters.push(rec);
  }
  rec.previous = math.prev;
  rec.current = math.curr;
  rec.price = math.price;
  rec.at = new Date().toISOString();
  const pay = payFor(unit.id);
  if (pay && pay.waterStatus !== "paid") pay.waterStatus = "unpaid";
  const body = `${unit.id}: previous ${qty(math.prev)}, current ${qty(math.curr)}, ${qty(math.units)} units × ${kes(math.price)} = ${kes(math.bill)}.`;
  notify("landlord", "Water bill " + verb, body + " Water status on the service charge ledger is " + (pay && pay.waterStatus === "paid" ? "Paid." : "Unpaid."), "Water Meter Management");
  if (unit.tenant) notify("tenant", "Water bill posted", `${periodLabel()} bill is ${kes(math.bill)} for ${qty(math.units)} units.`, "Water Meter Management", unit.id);
  ui.meterUnit = unit.id;
  save(); render();
  toast(`Reading ${verb}. ${qty(math.units)} units × ${kes(math.price)} = ${kes(math.bill)}.`);
}
function saveVisitor(fd) {
  const name = fd.get("name").trim();
  const expectedDate = fd.get("expectedDate");
  if (!name || !expectedDate) return toast("Enter the visitor name and the expected date.");
  const unit = unitById(ui.unitId);
  data.visitors.unshift({
    id: uid("v"), period: periodKey(), unitId: unit.id, name, expectedDate, expectedTime: fd.get("expectedTime") || "", note: fd.get("note").trim(),
    status: "expected", phone: "", idNumber: "", checkIn: null, checkOut: null
  });
  notify("management", "Visitor expected", `${name} → ${unit.id} on ${fmtDay(expectedDate)}.`, "Visitor Management");
  notify("landlord", "Visitor registered", `${name} → ${unit.id} on ${fmtDay(expectedDate)}. Waiting for the gate.`, "Visitor Management");
  save(); closeModal();
  toast(`Sent to security: ${name}, unit ${unit.id}, ${fmtDay(expectedDate)}.`);
}
function checkIn(fd) {
  const item = data.visitors.find(v => v.id === fd.get("id"));
  const phone = fd.get("phone").trim();
  const idNumber = fd.get("idNumber").trim();
  if (!item) return;
  if (phone.length < 6 || idNumber.length < 4) return toast("Enter the phone number and ID number from the visitor at the gate.");
  item.phone = phone;
  item.idNumber = idNumber;
  item.checkIn = new Date().toISOString();
  item.status = "in";
  const unit = unitById(item.unitId);
  notify("landlord", "Visitor checked in", `${item.name} checked in at ${item.unitId}. Phone ${phone}, ID ${idNumber}.`, "Visitor Management");
  notify("tenant", "Visitor checked in", `${item.name} checked in at ${fmtStamp(item.checkIn)}.`, "Visitor Management", item.unitId);
  notify("management", "Checked in", `${item.name} is on site at ${item.unitId}.`, "Visitor Management");
  save(); closeModal();
  toast(`${item.name} checked in at ${fmtStamp(item.checkIn)}. ${unit.id} log updated for the landlord.`);
}
function checkOut(id) {
  const item = data.visitors.find(v => v.id === id);
  if (!item || item.status !== "in") return toast("That visitor is not checked in.");
  item.checkOut = new Date().toISOString();
  item.status = "out";
  notify("landlord", "Visitor checked out", `${item.name} left ${item.unitId} at ${fmtStamp(item.checkOut)}.`, "Visitor Management");
  notify("tenant", "Visitor checked out", `${item.name} checked out at ${fmtStamp(item.checkOut)}.`, "Visitor Management", item.unitId);
  save(); render();
  toast(`${item.name} checked out at ${fmtStamp(item.checkOut)}. Times are on the landlord dashboard.`);
}

function onClick(event) {
  if (event.target.classList?.contains("overlay")) { closeModal(); return; }
  const btn = event.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === "enter") {
    ui.role = btn.dataset.role;
    if (ui.role === "tenant") ui.unitId = document.getElementById("gate-unit").value;
    ui.view = "home";
    ui.modal = null;
    saveUi();
    render({ toTop: true });
    return;
  }
  if (action === "switch-role") {
    ui.role = btn.dataset.role;
    ui.modal = null;
    ensureView();
    saveUi();
    render({ toTop: true });
    return;
  }
  if (action === "guide") { ui.role = null; ui.modal = null; saveUi(); render({ toTop: true }); return; }
  if (action === "set-view") { go(btn.dataset.view); return; }
  if (action === "open-unit") {
    ui.filters.charges = btn.dataset.unit;
    ui.filters.chargeStatus = "all";
    ui.filters.waterStatus = "all";
    go("charges");
    return;
  }
  if (action === "open-modal") { ui.modal = { type: btn.dataset.modal, id: btn.dataset.id || null }; render(); return; }
  if (action === "close-modal") { closeModal(); return; }
  if (action === "trigger-providers") { triggerProviders(); return; }
  if (action === "sync-charges") { syncCharges(); return; }
  if (action === "send-invoice") { sendInvoice(btn.dataset.id); return; }
  if (action === "check-out") { checkOut(btn.dataset.id); return; }
  if (action === "edit-meter") { ui.meterUnit = btn.dataset.id; render({ focus: "#meter-curr" }); return; }
  if (action === "filter-status") {
    const status = btn.dataset.status;
    if (btn.dataset.kind === "charges") ui.filters.chargeStatus = status;
    if (btn.dataset.kind === "water") ui.filters.waterStatus = status;
    if (btn.dataset.kind === "complaints") ui.filters.complaints = status;
    if (btn.dataset.kind === "visitors") ui.filters.visitors = status;
    saveUi();
    render();
    return;
  }
  if (action === "reset-demo") {
    if (!confirm("Restore the original demo data?")) return;
    data = fresh();
    save();
    ui.modal = null;
    ui.meterUnit = null;
    toast("Demo data restored.");
    render();
  }
}
function onSubmit(event) {
  const form = event.target;
  if (!(form instanceof HTMLFormElement)) return;
  event.preventDefault();
  const fd = new FormData(form);
  const kind = form.dataset.form;
  if (kind === "provider") saveProvider(fd);
  if (kind === "pay") payProvider(fd);
  if (kind === "complaint") saveComplaint(fd);
  if (kind === "response") saveResponse(fd, event.submitter?.value || "save");
  if (kind === "meter") saveMeter(fd);
  if (kind === "visitor") saveVisitor(fd);
  if (kind === "checkin") checkIn(fd);
}
function onChange(event) {
  if (event.target.id === "unit-switch") {
    ui.unitId = event.target.value;
    ui.modal = null;
    saveUi();
    render();
  }
  if (event.target.id === "meter-unit") {
    ui.meterUnit = event.target.value;
    render({ focus: "#meter-unit" });
  }
  if (event.target.id === "period-switch") {
    ui.period = event.target.value;
    ui.meterUnit = null;
    ui.modal = null;
    saveUi();
    render();
  }
}
function onInput(event) {
  const map = { "charge-filter": "charges", "complaint-unit": "complaintUnit", "visitor-unit": "visitorUnit" };
  if (map[event.target.id]) {
    ui.filters[map[event.target.id]] = event.target.value;
    saveUi();
    const results = document.getElementById("filter-results");
    if (results && ui.view === "charges") {
      const note = document.getElementById("filter-note");
      if (note) note.innerHTML = chargeNote();
      results.innerHTML = chargeBody() || `<tr><td colspan="8">No units match that filter.</td></tr>`;
      return;
    }
    if (results && (ui.view === "complaints" || ui.view === "visitors")) {
      const list = ui.view === "complaints" ? complaintList() : visitorList();
      const empty = ui.view === "complaints" ? "No complaints match this view." : "No visitors match this view.";
      const cards = list.map(item => ui.view === "complaints" ? complaintCard(item) : visitorCard(item)).join("");
      results.innerHTML = cards || `<div class="record"><p>${empty}</p></div>`;
      return;
    }
    return;
  }
  if (event.target.closest("#meter-form")) {
    const box = document.getElementById("meter-preview");
    if (!box) return;
    box.innerHTML = previewHtml(
      document.getElementById("meter-prev").value,
      document.getElementById("meter-curr").value,
      document.getElementById("meter-price").value
    );
  }
}

document.body.addEventListener("click", onClick);
document.body.addEventListener("submit", onSubmit);
document.body.addEventListener("change", onChange);
document.body.addEventListener("input", onInput);
document.addEventListener("keydown", event => { if (event.key === "Escape" && ui.modal) closeModal(); });
load();
render();
</script>
</body>
</html>
